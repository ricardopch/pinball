plugins {
    id 'com.android.application'
}

def ciBuild = System.getenv('GITHUB_RUN_NUMBER') ?: '1'
def ksFile = System.getenv('KEYSTORE_FILE')

android {
    namespace 'com.ricardopch.pinball'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ricardopch.pinball'
        minSdk 26
        targetSdk 35
        versionCode ciBuild.toInteger()
        versionName "1.0.${ciBuild}"
    }

    signingConfigs {
        // Clave de depuración fija (pública, sólo para instalar a mano): así cada APK nueva
        // se instala encima de la anterior sin desinstalar ni perder el récord.
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (ksFile) {
                storeFile file(ksFile)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ksFile ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress 'wav', 'woff2'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
