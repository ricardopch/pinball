name: Compilar APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'apk/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Preparar firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Firmando con la clave del repositorio"
          else
            echo "Sin KEYSTORE_BASE64: se firma con app/debug.keystore (clave fija del repositorio)"
          fi

      - name: Compilar
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p apk
          cp app/build/outputs/apk/release/app-release.apk apk/PinballVintage.apk
          ls -la apk

      - uses: actions/upload-artifact@v4
        with:
          name: PinballVintage-${{ github.run_number }}
          path: apk/PinballVintage.apk

      - name: Publicar versión
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" apk/PinballVintage.apk \
            --title "Pinball Vintage 1.0.${{ github.run_number }}" \
            --notes "APK compilada automáticamente desde ${GITHUB_SHA::7}. Descarga PinballVintage.apk e instálala en el móvil." \
            --latest

      - name: Guardar la APK en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/PinballVintage.apk
          git commit -m "APK 1.0.${{ github.run_number }} [skip ci]" || exit 0
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep 5
          done
